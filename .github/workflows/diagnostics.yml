name: Publish verified Windows portable
on:
  push:
    branches: [ci/windows-diagnostics]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve only the successful verified build
        run: |
          test "$(gh run view 39501504910 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view 39501504910 --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = a782a14dfb5e11c21538afd9570f6b8c580e0550
          gh run download 39501504910 --repo "$GITHUB_REPOSITORY" --name MediaDownloader-Windows-x64 --dir portable
      - name: Verify the downloaded portable checksum
        working-directory: portable
        run: sha256sum --check *.zip.sha256
      - name: Publish the identical tested ZIP
        run: gh release create v1.0.0 portable/* --repo "$GITHUB_REPOSITORY" --target a782a14dfb5e11c21538afd9570f6b8c580e0550 --title 'MediaDownloader 1.0.0' --notes-file release-notes-1.0.0.md
