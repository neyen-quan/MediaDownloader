name: Retrieve Windows diagnostics
on:
  push:
    branches: [ci/windows-diagnostics]
permissions:
  contents: write
  actions: read
jobs:
  diagnostics:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the controlled DASH probe
        run: |
          python -m pip install requests==2.34.2 yt-dlp==2026.8.19 pytest==9.1.1
          python -c "from tools.build_windows import get_ffmpeg; get_ffmpeg()"
      - name: Compare Windows DASH fixture paths
        shell: pwsh
        run: |
          $env:PATH = "$pwd\dist\MediaDownloader;$env:PATH"
          python -m pytest -q tests/test_media_pipeline.py > windows-test-diagnostics.txt 2>&1
      - name: Preserve diagnostics on this separate branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows-test-diagnostics.txt
          git commit -m 'Capture Windows multimedia test failure'
          git push origin HEAD:refs/heads/ci/windows-diagnostics
