name: Windows portable

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-2022
    permissions:
      contents: write # Publish controlled test diagnostics on a separate ci/ ref.
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias fijadas
        run: python -m pip install -r requirements-dev.txt
      - name: Recuperar base publicada y mantener FFmpeg sin cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/delta_release.py --prepare
      - name: Preparar FFmpeg verificado para todas las pruebas
        shell: pwsh
        run: |
          python -c "from tools.build_windows import get_ffmpeg; get_ffmpeg()"
          Add-Content -Path $env:GITHUB_PATH -Value "$pwd\dist\MediaDownloader"
      - name: Pruebas esenciales y del actualizador
        run: python -m pytest -q --junitxml=results.xml
      - name: Arranque de interfaz desde fuentes
        run: python main.py --smoke-test
      - name: Compilar portable y generar ZIP compatible
        run: python tools/build_windows.py
      - name: Verificar ejecutables, actualizar y recuperar
        run: python tools/test_portable.py
      - name: Verificar audio y video con FFmpeg incluido
        shell: pwsh
        run: |
          $env:PATH = "$pwd\dist\MediaDownloader;$env:PATH"
          $env:MEDIADOWNLOADER_TEST_EXE = "$pwd\dist\MediaDownloader\MediaDownloader.exe"
          python -m pytest -q tests/test_media_pipeline.py --junitxml=media-results.xml
      - name: Entregar solo después de verificar
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-Windows-x64
          path: |
            dist/MediaDownloader-*-Windows-x64.zip
            dist/MediaDownloader-*-Windows-x64.zip.sha256
          if-no-files-found: error
      - name: Generar y probar parche incremental desde la versión publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/delta_release.py
      - name: Entregar parche pequeño por separado
        if: hashFiles('dist/*-patch.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-parche
          path: |
            dist/*-patch.zip
            dist/*-patch.zip.sha256
          if-no-files-found: error
      - name: Publicar versión verificada y conservar base para próximos parches
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/mediadownloader-v1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/delta_release.py --publish
      - name: Informe de pruebas
        if: always()
        run: python tools/ci_report.py --publish
      - name: Conservar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-Windows
          path: '*results.xml'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MediaDownloader-Windows-x64
          path: release
      - name: Publicar portable probado
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "MediaDownloader $GITHUB_REF_NAME" --generate-notes
